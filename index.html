<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Assistant — Newcastle Grammar School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#003249;--navy-deep:#00263a;--navy-soft:#e7eef2;--navy-line:#d4e0e6;
    --accent:#1c6e8c;--ink:#13303d;--ink-soft:#5a727d;--white:#ffffff;
    --radius:16px;--shadow:0 1px 2px rgba(0,50,73,.05),0 10px 30px rgba(0,50,73,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  *,button,input,textarea,select{font-family:"Poppins",system-ui,sans-serif}
  ::placeholder{font-family:"Poppins",system-ui,sans-serif}
  html,body{height:100%}
  body{font-family:"Poppins",system-ui,sans-serif;
    background:radial-gradient(900px 500px at 85% -10%,var(--navy-soft) 0%,transparent 60%),radial-gradient(700px 400px at -5% 110%,#eef4f6 0%,transparent 55%),var(--white);
    color:var(--ink);display:flex;flex-direction:column;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 34px;border-bottom:1px solid var(--navy-line);background:rgba(255,255,255,.75);backdrop-filter:blur(10px)}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{height:38px;width:auto}
  .brand .div{width:1px;height:30px;background:var(--navy-line)}
  .brand .tool{font-size:14px;font-weight:500;color:var(--ink-soft)}
  .right{display:flex;align-items:center;gap:12px}
  .pill{font-size:11.5px;font-weight:500;padding:6px 13px;border-radius:99px}
  .pill.guard{background:var(--navy-soft);color:var(--navy)}
  .pill.user{background:var(--navy);color:#fff}
  .help-btn{font-family:"Poppins",system-ui,sans-serif;font-size:13px;font-weight:500;color:var(--navy);background:none;border:1px solid var(--navy-line);border-radius:99px;padding:7px 15px;cursor:pointer;transition:.16s;display:flex;align-items:center;gap:7px}
  .help-btn:hover{border-color:var(--accent);color:var(--accent)}
  .help-btn svg{width:15px;height:15px}
  .help-btn.newchat{background:var(--navy);color:#fff;border-color:var(--navy)}
  .help-btn.newchat:hover{background:var(--navy-deep);color:#fff;border-color:var(--navy-deep)}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
  .center{width:100%;max-width:720px;text-align:center;display:flex;flex-direction:column;align-items:center}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1.08;margin-bottom:34px;color:var(--navy)}
  h1 span{color:var(--accent)}

  .composer{width:100%;background:var(--white);border:1px solid var(--navy-line);border-radius:20px;box-shadow:var(--shadow);padding:10px 10px 10px 22px;display:flex;align-items:flex-end;gap:10px;transition:.18s}
  .composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(28,110,140,.12)}
  .composer textarea{flex:1;border:none;outline:none;resize:none;background:transparent;font-family:"Poppins",system-ui,sans-serif;font-size:16px;font-weight:400;color:var(--ink);line-height:1.5;padding:11px 0;max-height:170px}
  .composer textarea::placeholder{color:#9fb2ba;font-weight:300}
  .send{width:44px;height:44px;border-radius:13px;border:none;background:var(--navy);color:#fff;display:grid;place-items:center;cursor:pointer;transition:.18s;flex-shrink:0}
  .send:hover{background:var(--navy-deep)}
  .send svg{width:19px;height:19px}

  .chips{display:flex;flex-wrap:nowrap;gap:8px;justify-content:center;margin-top:16px;width:100%}
  .chip{background:var(--white);border:1px solid var(--navy-line);border-radius:99px;padding:6px 13px;font-family:"Poppins",system-ui,sans-serif;font-size:12.5px;font-weight:400;color:var(--ink-soft);cursor:pointer;transition:.16s;white-space:nowrap}
  .chip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}

  .overlay{position:fixed;inset:0;background:rgba(0,38,58,.42);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:24px;animation:fade .2s ease}
  .overlay.show{display:flex}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--white);border-radius:22px;box-shadow:0 24px 60px rgba(0,50,73,.28);width:100%;max-width:560px;padding:28px;animation:pop .26s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .modal-head h2{font-size:20px;font-weight:600;color:var(--navy)}
  .modal-head .x{width:32px;height:32px;border-radius:9px;border:none;background:var(--navy-soft);color:var(--navy);cursor:pointer;display:grid;place-items:center;transition:.15s}
  .modal-head .x:hover{background:var(--navy);color:#fff}
  .modal-head .x svg{width:16px;height:16px}
  .modal .sub{font-size:13.5px;font-weight:300;color:var(--ink-soft);margin-bottom:20px}
  .qh-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .qh-item{background:var(--white);border:1px solid var(--navy-line);border-radius:14px;padding:16px;cursor:pointer;transition:.18s;display:flex;align-items:center;gap:13px;text-align:left}
  .qh-item:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
  .qh-item .ic{width:40px;height:40px;border-radius:11px;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center;flex-shrink:0;transition:.18s}
  .qh-item:hover .ic{background:var(--navy);color:#fff}
  .qh-item .ic svg{width:20px;height:20px}
  .qh-item .txt b{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:2px}
  .qh-item .txt span{font-size:12px;font-weight:300;color:var(--ink-soft);line-height:1.35}

  .thread{display:none;flex-direction:column;gap:26px;width:100%;max-width:720px;text-align:left;padding:10px 0 20px}
  .thread.show{display:flex}
  .stage.chatting{justify-content:flex-start;padding-top:36px}
  .msg{display:flex;gap:14px;align-items:flex-start;animation:rise .4s ease}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg .who{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;font-size:13px;font-weight:600}
  .msg.user .who{background:var(--navy-soft);color:var(--navy)}
  .msg.bot .who{background:var(--navy);color:#fff}
  .bubble{font-size:15.5px;font-weight:300;line-height:1.65;padding-top:5px;color:var(--ink)}
  .bubble strong{font-weight:600}

  .loader{display:flex;align-items:center;gap:13px;padding-top:7px}
  .blobs{width:52px;height:26px;position:relative;filter:url(#goo)}
  .blob{position:absolute;top:5px;width:16px;height:16px;border-radius:50%;background:var(--accent)}
  .b1{left:0;animation:m1 1.6s ease-in-out infinite}
  .b2{left:17px;animation:m2 1.6s ease-in-out infinite}
  .b3{left:34px;animation:m1 1.6s ease-in-out infinite .2s}
  @keyframes m1{0%,100%{transform:translateX(0) scale(1)}50%{transform:translateX(9px) scale(1.25)}}
  @keyframes m2{0%,100%{transform:translateX(0) scale(1.1)}50%{transform:translateX(-9px) scale(.8)}}
  .loader .lt{font-size:13.5px;font-weight:300;color:var(--ink-soft);font-style:italic}

  .table-demo{margin-top:12px;border:1px solid var(--navy-line);border-radius:12px;overflow:hidden;font-size:13.5px;font-weight:400}
  .table-demo .r{display:grid;grid-template-columns:1.4fr 1fr .8fr;padding:9px 15px;border-bottom:1px solid var(--navy-line)}
  .table-demo .r:last-child{border-bottom:none}
  .table-demo .r.h{background:var(--navy-soft);color:var(--navy);font-weight:600}

  .footer-note{padding:14px;text-align:center;font-size:12px;font-weight:300;color:var(--ink-soft)}
  .hidden{display:none!important}
  ::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:#cddbe1;border-radius:9px}
  @media(max-width:720px){h1{font-size:30px}.topbar{padding:14px 18px}.chips{flex-wrap:wrap}.qh-row{grid-template-columns:1fr}}
</style>
</head>

        <button class="send" onclick="sendCurrent()" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <div class="chips">
        <button class="chip" onclick="fill('Draft an email to a parent, explaining that their child was kept back for a detention at lunch due to unsatisfactory completion of work during their mathematics lesson today.')">Draft a parent email</button>
        <button class="chip" onclick="fill('Write a Schoolbox post announcing that auditions are opening for the school play, and will be held on Wednesday Week 5, in HHH.')">Write a Schoolbox post</button>
        <button class="chip" onclick="fill('Give me a list of all boys in Year 12 that study economics.')">Find students by criteria</button>
        <button class="chip" onclick="fill('Reword this assessment feedback to sound professional and supportive.')">Reword something</button>
      </div>
    </div>

    <div class="thread" id="thread">
      <div class="msg user"><div class="who">WB</div><div class="bubble" id="userMsg"></div></div>
      <div class="msg bot"><div class="who">NGS</div><div class="bubble" id="botBubble"></div></div>
    </div>
  </main>

  <div class="footer-note">Staff Assistant can make mistakes. Verify student data and sensitive content before acting.</div>

  <div class="overlay" id="overlay" onclick="if(event.target===this)closeHelp()">
    <div class="modal">
      <div class="modal-head"><h2>Quick help</h2><button class="x" onclick="closeHelp()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <p class="sub">Pick a starting point — it'll drop into the chat box so you can tweak it before sending.</p>
      <div class="qh-row">
        <button class="qh-item" onclick="fillFromHelp('Summarise the key risk points from the attached excursion plan into a one-paragraph staff brief.')">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></div>
          <div class="txt"><b>Summarise a document</b><span>Policies, plans, long threads</span></div></button>
        <button class="qh-item" onclick="fillFromHelp('Draft a reply to a parent concerned about their child&#39;s homework load.')">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
          <div class="txt"><b>Reply to a parent</b><span>Tone-checked responses</span></div></button>
        <button class="qh-item" onclick="fillFromHelp('Which Year 11 students are enrolled in both Chemistry and Biology?')">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="12" r="5"/><circle cx="16" cy="12" r="5"/></svg></div>
          <div class="txt"><b>Cross-subject lists</b><span>Query cohorts and overlaps</span></div></button>
        <button class="qh-item" onclick="fillFromHelp('Turn these dot points into a polished newsletter blurb for the music department.')">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19V5l16-2v14"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="17" r="2"/></svg></div>
          <div class="txt"><b>Newsletter blurb</b><span>Polish dot points into prose</span></div></button>
      </div>
    </div>
  </div>

<script>
  const input=document.getElementById('input');
  input.addEventListener('input',()=>{input.style.height='auto';input.style.height=input.scrollHeight+'px';});
  function fill(text){input.value=text;input.style.height='auto';input.style.height=input.scrollHeight+'px';input.focus();}
  function openHelp(){document.getElementById('overlay').classList.add('show');}
  function closeHelp(){document.getElementById('overlay').classList.remove('show');}
  function fillFromHelp(text){closeHelp();fill(text);}
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeHelp();});

  const loaderMsgs=["Checking the school systems…","Drafting a response…","Pulling that together…","Working on it…"];
  function send(text){
    document.getElementById('welcome').classList.add('hidden');
    document.getElementById('userMsg').textContent=text;
    const bot=document.getElementById('botBubble');
    const lt=loaderMsgs[Math.floor(Math.random()*loaderMsgs.length)];
    bot.innerHTML='<div class="loader"><div class="blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div><span class="lt">'+lt+'</span></div>';
    document.getElementById('thread').classList.add('show');
    document.getElementById('stage').classList.add('chatting');
    document.getElementById('newChatBtn').classList.remove('hidden');
    setTimeout(function(){bot.innerHTML=demoResponse(text);},2600);
  }
  function sendCurrent(){const v=input.value.trim();if(!v)return;send(v);input.value='';input.style.height='auto';}
  function resetChat(){
    document.getElementById('thread').classList.remove('show');
    document.getElementById('stage').classList.remove('chatting');
    document.getElementById('welcome').classList.remove('hidden');
    document.getElementById('newChatBtn').classList.add('hidden');
    input.value='';input.style.height='auto';input.focus();
  }
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendCurrent();}});

  function demoResponse(text){
    if(/year 12|economics|list of|students/i.test(text)){
      return 'Here\'s a list of <strong>Year 12 boys studying Economics</strong>, pulled from the enrolment system.'+
      '<div class="table-demo"><div class="r h"><span>Student</span><span>Class</span><span>Teacher</span></div>'+
      '<div class="r"><span>James W.</span><span>12 ECO1</span><span>Ms Hale</span></div>'+
      '<div class="r"><span>Oliver K.</span><span>12 ECO1</span><span>Ms Hale</span></div>'+
      '<div class="r"><span>Lucas D.</span><span>12 ECO2</span><span>Mr Voss</span></div>'+
      '<div class="r"><span>Henry B.</span><span>12 ECO2</span><span>Mr Voss</span></div></div>'+
      '<p style="margin-top:13px">Want me to export this as a CSV, or email their Economics teachers?</p>';
    }
    return 'Here\'s a first draft based on your request. <strong>Review before sending</strong> — I\'ve aimed for a warm, professional NGS tone. Let me know if you\'d like it shorter, more formal, or adjusted in any way.';
  }
</script>
</body>
</html>
